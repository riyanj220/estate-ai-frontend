name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Production-mode checks (each builds and starts the app against the stub on its own ports): route guards, and the
      # proxy passing 5 MB uploads, bodies over 10 MB and binary images through untouched.
      - run: npm run check:prod-admin
      - run: npm run check:prod-listings
      # Offline: regenerate the client from the committed spec copy and diff.
      - run: npm run api:check -- --offline
      # Online: the committed spec copy must equal the backend main openapi.yaml.
      # Only on pushes to main, so a frontend PR can precede its backend merge.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run api:check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
