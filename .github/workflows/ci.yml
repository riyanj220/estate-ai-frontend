name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", ".gitignore"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", ".gitignore"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changed-spec run on pull requests diffs against main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Next's compiler cache: each of the builds below (app, prod checks, shards) reuses it.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Production-mode checks (each builds and starts the app against the stub on its own ports): route guards, and the
      # proxy passing 5 MB uploads, bodies over 10 MB and binary images through untouched.
      - run: npm run check:prod-admin
      - run: npm run check:prod-listings
      - run: npm run check:prod-profile
      # Offline: regenerate the client from the committed spec copy and diff.
      - run: npm run api:check -- --offline
      # Online: the committed spec copy must equal the backend main openapi.yaml.
      # Only on pushes to main, so a frontend PR can precede its backend merge.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run api:check
      - id: pw
        run: echo "version=$(npx playwright --version | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Pushes to main run the whole suite (parallel shards on a production build). A pull request runs only the
      # @smoke tests plus the spec files it changes; the full suite then runs when it lands on main.
      - if: github.event_name == 'push'
        run: npm run test:e2e
      - if: github.event_name == 'pull_request'
        run: npm run test:e2e:changed
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
