  /api/v1/listings/{listing_id}/publish:
    post:
      operationId: publish_listing
      description: 'Needs `X-CSRFToken` and an `Idempotency-Key` header (1 to 128
        characters from `A-Za-z0-9._:-`; a missing or malformed one is `400 validation_error`
        under `fields.idempotency_key`). Body: `{base_revision}` and nothing else.
        Publishing is immediate (no approval) and all-or-nothing: it uses one of the
        owner''s monthly publications and makes the Listing public if its owner is
        Active. The same key with the same body within 24 hours returns the Listing
        as it is now with no second publication; the same key with another body is
        `422 idempotency_key_reused`. Refusals, in order: another account''s, an administrator''s,
        an unknown and a malformed id are `404 not_found`; a Visitor is `401`; a `base_revision`
        that is not the current `revision` is `409 stale_revision` with the Listing
        under `current`; a Listing that is not a `draft` is `409 conflict`; a restricted
        Listing is `403 forbidden`; an Email-unverified account is `403 email_not_verified`
        and a Suspended one `403 publishing_unavailable`; every missing or invalid
        required item is `400 validation_error`, all at once, keyed by registry field
        id (`required` and the field''s own codes), `images` (`images_required`: at
        least one image) and a field of class `private` or of the quota identity that
        the Assistant filled in and the owner has not confirmed (`confirm_required`);
        a used-up allowance is `409 quota_exhausted` with the caller''s own `limit`,
        `used` and `resets_at` under `details`. A refused attempt consumes nothing.
        Never cached.'
      summary: Publish one of the signed-in account's own Drafts
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
