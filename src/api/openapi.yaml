      - private_society
      - none
      - other
      type: string
      description: |-
        * `lda` - lda
        * `cda` - cda
        * `kda` - kda
        * `rda` - rda
        * `fda` - fda
        * `mda` - mda
        * `gda` - gda
        * `bda` - bda
        * `peshawar_development_authority` - peshawar_development_authority
        * `private_society` - private_society
        * `none` - none
        * `other` - other
    AreaUnitEnum:
      enum:
      - sqft
      - sqyd
      - marla
      - kanal
      - acre
      type: string
      description: |-
        * `sqft` - sqft
        * `sqyd` - sqyd
        * `marla` - marla
        * `kanal` - kanal
        * `acre` - acre
    AssistantApplied:
      type: object
      properties:
        field:
          type: string
          description: A registry field id.
        value:
          description: 'As on the Listing: text, integer or boolean.'
