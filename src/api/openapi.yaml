  /api/v1/admin/listings:
    get:
      operationId: list_admin_listings
      description: 20 per page; `next` is a link, `previous` is always null. Without
        `status` every non-Draft Listing; `status=draft` lists Drafts without their
        content. `owner` is an account id; the dates are Karachi calendar days, inclusive.
        Visitors get `401 unauthenticated`; signed-in non-administrators get `404
        not_found`. Never cached.
      summary: Listings for review, newest first
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - apartment
          - commercial
          - house
          - plot
      - in: query
        name: created_from
        schema:
          type: string
          format: date
      - in: query
        name: created_to
        schema:
          type: string
          format: date
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: owner
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - archived
          - draft
          - published
          - removed
          - rented
          - sold
      tags:
      - admin
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListingPage'
          description: One page
        '400':
          description: Bad request or validation error
          content:
            application/json:
