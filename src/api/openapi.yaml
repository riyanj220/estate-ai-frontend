      - year
      type: string
      description: |-
        * `day` - day
        * `week` - week
        * `month` - month
        * `year` - year
    RepublishedListing:
      type: object
      description: The owner Listing plus how the republication was recorded (Story
        2.18).
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ListingStatusEnum'
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
        revision:
          type: integer
          minimum: 1
        registry_version:
          type: integer
          minimum: 1
        fields:
          $ref: '#/components/schemas/ListingFields'
        provenance:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ProvenanceEntry'
          description: Registry field id -> where the value came from; set fields
            only.
        media:
          type: array
          items:
            $ref: '#/components/schemas/Image'
          description: The images in `position` order; empty when there are none.
        restricted:
          type: boolean
          description: 'Set by moderation: a restricted Listing is never public and
            the owner cannot edit it (it may still be archived). Owner resource only,
            never in a public shape.'
        restriction_reason:
          type: string
          nullable: true
          description: A short plain-text reason for a restricted or removed Listing,
            shown to the owner only; null otherwise.
          maxLength: 200
        publication_kind:
          allOf:
          - $ref: '#/components/schemas/PublicationKindEnum'
          description: |-
            `republish_counted` used one of the owner's monthly publications; `republish_free` used none (same Karachi month as the last counted publication, identity unchanged).

            * `republish_counted` - republish_counted
            * `republish_free` - republish_free
      required:
      - fields
      - id
      - media
      - provenance
      - publication_kind
      - registry_version
      - restricted
      - restriction_reason
      - revision
      - status
      - visibility
