      - field
      - value
    AssistantClaim:
      type: object
      properties:
        text:
          type: string
          description: One sentence of the description. Plain text.
        fields:
          type: array
          items:
            type: string
          description: The confirmed fields it rests on.
      required:
      - fields
      - text
    AssistantDescriptionBodyRequest:
      type: object
      properties:
        base_revision:
          type: integer
          minimum: 1
          description: The `revision` of the Draft the client last read.
        replace:
          type: boolean
          description: True to overwrite a description the Seller wrote.
      required:
      - base_revision
    AssistantDescriptionResult:
      type: object
      properties:
        outcome:
          $ref: '#/components/schemas/OutcomeEnum'
        message:
          type: string
        listing:
          allOf:
          - $ref: '#/components/schemas/Listing'
          nullable: true
          description: With the saved description (unconfirmed); null unless `success`.
        claims:
          type: array
          items:
            $ref: '#/components/schemas/AssistantClaim'
          description: The per-claim checklist.
        left_out:
          type: array
          items:
            type: string
          description: 'Fields not used: not confirmed yet.'
      required:
      - claims
      - left_out
      - listing
      - message
      - outcome
    AssistantFact:
      type: object
      properties:
        field:
          type: string
          description: A registry field id.
        value:
