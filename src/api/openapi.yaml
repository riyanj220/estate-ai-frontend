      type: object
      properties:
        title:
          type: string
        source:
          type: string
        version:
          type: integer
      required:
      - source
      - title
      - version
    AssistantTurn:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sequence:
          type: integer
        client_turn_id:
          type: string
          format: uuid
        message:
          type: string
          description: The caller's message after redaction. Plain text.
        reply:
          type: string
          description: The assistant's reply. Plain text.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/AssistantSource'
          description: Knowledge base passages given to the assistant for this reply.
        created_at:
          type: string
          format: date-time
        applied:
          type: array
          items:
            $ref: '#/components/schemas/AssistantApplied'
          description: Saved to the Draft, unconfirmed.
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/AssistantRejected'
          description: Understood but not saved.
        conflicts:
          type: array
          items:
            type: string
          description: 'Fields the Seller changed while the assistant worked: left
