              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: update_agency_profile
      description: Needs `X-CSRFToken`. Only `agency_name`, `description`, `city_id`,
        `business_phone` and `office_address` are accepted, at least one; any other
        field (the email and verification status included) is `validation_error` (`unknown_field`).
        Name, phone, address and city stay mandatory (blank or null is `required`);
        a blank or null description clears it. A description with phone numbers, email
        addresses or street addresses is `fields.description = contains_contact_details`.
        All failing fields are reported at once. An unchanged submission succeeds
        and records nothing.
      summary: Change the signed-in Agency's business details
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAgencyProfileUpdateRequest'
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
