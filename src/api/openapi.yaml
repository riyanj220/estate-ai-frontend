openapi: 3.0.3
info:
  title: EstateAI API
  version: 1.0.0
  description: EstateAI backend contract. One error envelope, stable error codes.
paths:
  /api/v1/csrf:
    get:
      operationId: get_csrf_token
      description: Sets the (HttpOnly) CSRF cookie and returns the matching token,
        which the client sends back as `X-CSRFToken` on sign-in and sign-out. Never
        cached.
      summary: Fetch a CSRF token
      tags:
      - csrf
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: The token
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/email-verification-requests:
    post:
      operationId: request_email_verification
      description: Always answers the same 202 whether or not the address is registered;
        the limit applies to every request alike.
      summary: Request a new verification link
      tags:
      - email-verification-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequestRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAccepted'
          description: Check your email
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/email-verifications/confirm:
    post:
      operationId: confirm_email_verification
      description: 'POST, not GET, so link prefetchers cannot consume the single-use
        token. Errors: `link_invalid`, `link_expired` (410), `link_used` (409).'
      summary: Confirm an email verification link
      tags:
      - email-verifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verified'
          description: Email verified
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/health:
    get:
      operationId: health
      description: Liveness plus database reachability. Never reveals connection details.
      summary: Liveness plus database reachability
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: Service and database are reachable
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnavailable'
          description: Database unreachable
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/me:
    get:
      operationId: get_me
      summary: The signed-in actor
      tags:
      - me
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorSummary'
          description: The caller
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/reference/cities:
    get:
      operationId: list_cities
      description: 'Unpaginated: the list is small and bounded.'
      summary: Cities available for selection
      tags:
      - reference
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityList'
          description: Active cities by name
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/registrations/individuals:
    post:
      operationId: register_individual
      description: The answer is the same whether or not the email is already registered;
        an existing address receives an 'already registered' notice by email instead.
      summary: Register an Individual account
      tags:
      - registrations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndividualRegistrationRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAccepted'
          description: Check your email to continue
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/session:
    post:
      operationId: sign_in
      description: Needs an `X-CSRFToken` header (fetch it from `GET /api/v1/csrf`).
        On success sets the HttpOnly `estate_session` cookie. Wrong password, unknown
        email, a Deactivated account and a throttled attempt all answer the same `401
        invalid_credentials`.
      summary: Sign in
      tags:
      - session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorSummary'
          description: Signed in
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: sign_out
      description: Ends only the current session and clears the cookie. Needs `X-CSRFToken`.
        Without a valid session the answer is `401 unauthenticated`.
      summary: Sign out
      tags:
      - session
      security:
      - sessionCookie: []
      responses:
        '204':
          description: Signed out
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    AccountTypeEnum:
      enum:
      - individual
      - agency
      - admin
      type: string
      description: |-
        * `individual` - individual
        * `agency` - agency
        * `admin` - admin
    ActorSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        state:
          $ref: '#/components/schemas/StateEnum'
        email:
          type: string
          description: 'The account''s own email. Private: owner only.'
        full_name:
          type: string
          description: Individual profile name; empty when none.
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/CapabilitiesEnum'
      required:
      - account_type
      - capabilities
      - email
      - full_name
      - id
      - state
    CapabilitiesEnum:
      enum:
      - sign_in
      - browse
      - view_drafts
      - edit_drafts
      - publish
      - send_messages
      - read_conversations
      - report
      - request_support
      - request_deactivation
      type: string
      description: |-
        * `sign_in` - sign_in
        * `browse` - browse
        * `view_drafts` - view_drafts
        * `edit_drafts` - edit_drafts
        * `publish` - publish
        * `send_messages` - send_messages
        * `read_conversations` - read_conversations
        * `report` - report
        * `request_support` - request_support
        * `request_deactivation` - request_deactivation
    City:
      type: object
      description: 'Allowlist. Names are plain strings: city values are managed in
        the database.'
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    CityList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/City'
      required:
      - items
    ConfirmEmailRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          description: The token from the verification link.
      required:
      - token
    CsrfToken:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    EmailVerifiedStatusEnum:
      enum:
      - verified
      type: string
      description: '* `verified` - verified'
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
      required:
      - status
    HealthStatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    HealthUnavailable:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthUnavailableStatusEnum'
      required:
      - status
    HealthUnavailableStatusEnum:
      enum:
      - unavailable
      type: string
      description: '* `unavailable` - unavailable'
    IndividualRegistrationRequest:
      type: object
      description: |-
        Strict allowlist of the four fields. Rules come from `identity.validation`; every failing
        field is reported at once, and an unknown field (such as `role`) is refused.
      properties:
        full_name:
          type: string
          minLength: 1
          description: 2 to 80 letters, spaces, hyphens, apostrophes, full stops.
        email:
          type: string
          minLength: 1
          description: At most 254 characters.
        password:
          type: string
          minLength: 1
          description: 8 to 1024 characters, not a common password, not the email
            address.
        phone:
          type: string
          minLength: 1
          description: Pakistani mobile (03xx xxxxxxx) or international number (+,
            8 to 15 digits).
      required:
      - email
      - full_name
      - password
      - phone
    RegistrationAccepted:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/RegistrationAcceptedStatusEnum'
      required:
      - status
    RegistrationAcceptedStatusEnum:
      enum:
      - check_your_email
      type: string
      description: '* `check_your_email` - check_your_email'
    SignInRequest:
      type: object
      description: Exactly `email` and `password`, both strings. Nothing else is accepted.
      properties:
        email:
          type: string
          minLength: 1
          description: The account email; matched case-insensitively.
        password:
          type: string
          minLength: 1
          description: The account password.
      required:
      - email
      - password
    StateEnum:
      enum:
      - email_unverified
      - active
      - suspended
      - deactivated
      type: string
      description: |-
        * `email_unverified` - email_unverified
        * `active` - active
        * `suspended` - suspended
        * `deactivated` - deactivated
    VerificationRequestRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          description: The address to send a new link to.
      required:
      - email
    Verified:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/EmailVerifiedStatusEnum'
      required:
      - status
    ErrorCode:
      type: string
      enum:
      - bad_request
      - validation_error
      - link_invalid
      - unauthenticated
      - invalid_credentials
      - forbidden
      - not_found
      - method_not_allowed
      - not_acceptable
      - stale_revision
      - link_used
      - link_expired
      - unsupported_media_type
      - idempotency_key_reused
      - throttled
      - server_error
      description: Stable error code catalogue.
    ErrorBody:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        request_id:
          type: string
      required:
      - code
      - message
      - fields
      - request_id
    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: estate_session
