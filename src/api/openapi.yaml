        visible Listings (published, not restricted, owner Active). Every filter given
        must hold; a Listing that has not answered an attribute never matches a filter
        on it. A `prefer_` parameter excludes nothing: it only ranks under `sort=relevance`
        (the default when one is given; otherwise `newest`). Prices are compared as
        stored, so give `purpose` to keep sale and rent apart. Area is in square feet.
        `GET /api/v1/public/filters` describes the parameters. `limit` is 1 to 50
        (default 20); `next` is the link to the following page and carries an opaque
        `cursor`, valid only with the same filters and sort. An unknown, repeated
        or bad parameter is `400 validation_error` under its name in `fields`. `200`
        has `Cache-Control: public, max-age=60` and no cookie (so a Listing may stay
        in a cache for up to a minute after it stops being public); errors are `no-store`.'
