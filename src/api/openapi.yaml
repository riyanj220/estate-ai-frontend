  /api/v1/listings/{listing_id}/images/{image_id}/file:
    get:
      operationId: get_listing_image_file
      description: 'The media endpoint: the only place an image is served, decided
        at request time by the single visibility policy. An image of a public Listing
        (Published, not restricted, owner Active) goes to anyone, a Visitor and an
        administrator included, with `Cache-Control: public, max-age=60` (so it may
        stay in a cache for up to a minute after the Listing stops being public),
        no cookie and nothing varying by cookie, whatever cookies the request carries.
        An image of any other Listing (a Draft, a restricted one, one whose owner
        is Suspended or Deactivated) goes only to the owning account (Suspended and
        Email-unverified owners included, a Deactivated one not) with `Cache-Control:
        private, no-store`; an administrator also gets non-Draft images for moderation
        review, never cached. Anyone else (another account, a Visitor), an unknown
        or malformed id and another Listing''s image get the same `404 not_found`
        (a Visitor gets 404, never 401). The body is the stored, re-encoded image
        with its stored `Content-Type` (`image/jpeg`, `image/png` or `image/webp`),
        `Content-Length`, `X-Content-Type-Options: nosniff`, `Content-Disposition:
        inline` (no file name) and `Content-Security-Policy: default-src ''none'';
        sandbox`. `HEAD` answers the same headers without a body. `Range` is ignored
        (always `200`, the whole file) and there is no `ETag`. `Accept` is ignored.'
      summary: The bytes of one image of a Listing the caller may see
      parameters:
      - in: path
        name: image_id
        schema:
          type: string
        required: true
      - in: path
        name: listing_id
        schema:
          type: string
        required: true
      tags:
      - listings
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
          description: The stored image bytes
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
