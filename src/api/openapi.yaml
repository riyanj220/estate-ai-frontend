openapi: 3.0.3
info:
  title: EstateAI API
  version: 1.0.0
  description: EstateAI backend contract. One error envelope, stable error codes.
paths:
  /api/v1/health:
    get:
      operationId: health
      description: Liveness plus database reachability. Never reveals connection details.
      summary: Liveness plus database reachability
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: Service and database are reachable
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnavailable'
          description: Database unreachable
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/reference/cities:
    get:
      operationId: list_cities
      description: 'Unpaginated: the list is small and bounded.'
      summary: Cities available for selection
      tags:
      - reference
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityList'
          description: Active cities by name
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/registrations/individuals:
    post:
      operationId: register_individual
      description: The answer is the same whether or not the email is already registered;
        an existing address receives an 'already registered' notice by email instead.
      summary: Register an Individual account
      tags:
      - registrations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndividualRegistrationRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAccepted'
          description: Check your email to continue
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    City:
      type: object
      description: 'Allowlist. Names are plain strings: city values are managed in
        the database.'
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    CityList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/City'
      required:
      - items
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
      required:
      - status
    HealthStatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    HealthUnavailable:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthUnavailableStatusEnum'
      required:
      - status
    HealthUnavailableStatusEnum:
      enum:
      - unavailable
      type: string
      description: '* `unavailable` - unavailable'
    IndividualRegistrationRequest:
      type: object
      description: |-
        Strict allowlist of the four fields. Rules come from `identity.validation`; every failing
        field is reported at once, and an unknown field (such as `role`) is refused.
      properties:
        full_name:
          type: string
          minLength: 1
          description: 2 to 80 letters, spaces, hyphens, apostrophes, full stops.
        email:
          type: string
          minLength: 1
          description: At most 254 characters.
        password:
          type: string
          minLength: 1
          description: 8 to 1024 characters, not a common password, not the email
            address.
        phone:
          type: string
          minLength: 1
          description: Pakistani mobile (03xx xxxxxxx) or international number (+,
            8 to 15 digits).
      required:
      - email
      - full_name
      - password
      - phone
    RegistrationAccepted:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/RegistrationAcceptedStatusEnum'
      required:
      - status
    RegistrationAcceptedStatusEnum:
      enum:
      - check_your_email
      type: string
      description: '* `check_your_email` - check_your_email'
    ErrorCode:
      type: string
      enum:
      - bad_request
      - validation_error
      - unauthenticated
      - forbidden
      - not_found
      - method_not_allowed
      - not_acceptable
      - stale_revision
      - unsupported_media_type
      - idempotency_key_reused
      - throttled
      - server_error
      description: Stable error code catalogue.
    ErrorBody:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        request_id:
          type: string
      required:
      - code
      - message
      - fields
      - request_id
    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
