          description: False for an unconfirmed assistant value.
      required:
      - confirmed
      - field
      - value
    AssistantNextStep:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/AssistantNextStepKindEnum'
        question:
          type: string
          description: Plain text.
        fields_asked:
          type: array
          items:
            type: string
          description: The missing required fields asked about; empty for `review`.
        optional:
          type: array
          items:
            type: string
          description: Missing optional fields the Seller may add.
        in_form:
          type: boolean
          description: True when only the manual form can set it.
      required:
      - fields_asked
      - in_form
      - kind
      - optional
      - question
    AssistantNextStepKindEnum:
      enum:
