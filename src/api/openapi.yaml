      description: 'Agency accounts only. The logo is then public through `GET /api/v1/agencies/{agency_id}/logo`,
        but only while the Agency account is Active. Needs `X-CSRFToken` and a `multipart/form-data`
        body with exactly one part, `file` (any other part, a non-file `file` or more
        than one file is `validation_error`). The request body may be at most 6 MB
        and the image at most 5 MB (5,242,880 bytes). Same pipeline and `fields.file`
        codes as the Listing image upload (`too_large`, `unsupported_type`, `too_large_dimensions`,
        `too_small`, `invalid_image`, `required`, `invalid`): the file name and declared
        type are ignored and never stored, the image is decoded, stripped of ALL metadata
        and encoded again (long side at most 2,048 px). Uploading again replaces the
        previous image, whose file and storage bytes are released in the same step.
        The account type is checked before the body (`403 forbidden` for the other
        type and administrators, `401` for a Visitor); a Deactivated account has no
        session. The account state follows the profile update (Active, Email-unverified
        and Suspended may change it). `409 storage_cap_exceeded` (counted on the stored
        size, replacement counted at its net size), `429` is the upload limit (10
        per hour per account) with `Retry-After`, `503 busy` (with `Retry-After`)
        means image processing is at capacity: retry. Never cached.'
