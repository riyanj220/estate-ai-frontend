  /api/v1/listings/{listing_id}/images:
    post:
      operationId: upload_listing_image
      description: 'Needs `X-CSRFToken` and a `multipart/form-data` body with exactly
        one part, `file` (any other part, a non-file `file` or more than one file
        is `validation_error`). The request body may be at most 6 MB and the image
        at most 5 MB (5,242,880 bytes). The file name and declared content type are
        ignored and never stored: the type is decided from the decoded image (JPEG,
        PNG or WebP only; animated images, GIF, SVG, TIFF, BMP, HEIC and the like
        are refused). The image is decoded, rotated by its EXIF orientation, stripped
        of ALL metadata (EXIF, GPS, XMP, comments, colour profile) and encoded again,
        with its long side at most 2,048 px; the response describes that stored file.
        `400 validation_error` carries a code under `fields.file`: `too_large`, `unsupported_type`,
        `too_large_dimensions` (above 10,000 px on a side or 40 megapixels), `too_small`
        (below 200 x 200), `invalid_image`, `required` or `invalid`. Another account''s,
        an unknown or a malformed Listing is `404 not_found`; an account that may
        not edit, or a Listing that is not editable (sold, rented, removed or restricted),
        is `403 forbidden`. `409` carries `too_many_images` (a Listing holds at most
        10) or `storage_cap_exceeded` (200 MB for an Individual, 1 GB for an Agency,
        counted on the stored size). `429` is the upload limit (30 per hour per account)
        with `Retry-After`. `503 busy` (with `Retry-After`) means image processing
        is at capacity or too slow: retry. The Listing `revision` rises by one, so
        a concurrent editor gets `409 stale_revision`. Never cached. The first image
        of a Listing becomes its cover; a later upload never changes it.'
      summary: Add an image to one of the signed-in account's own editable Listings
      parameters:
      - in: path
        name: listing_id
        schema:
          type: string
        required: true
      tags:
      - listings
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageUploadRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
          description: The stored image
        '409':
          description: '`too_many_images` or `storage_cap_exceeded`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: '`busy`: image processing is at capacity; retry'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: set_listing_image_order
      description: 'Needs `X-CSRFToken`. Body: `{base_revision, order, cover_id?}`
        and nothing else (any other key is `validation_error` `unknown_field`). `order`
        is the full list of the Listing''s image ids in the wanted order, each exactly
        once; the positions become 0..n-1 in that order. `cover_id` (optional; null
        or omitted keeps the cover) must be one of the Listing''s images. The Listing
        always has exactly one cover while it has images. `400 validation_error` carries
        `invalid` under `fields.order` (a missing, duplicate, unknown or another Listing''s
        id, or not a list of ids), `fields.cover_id` or `fields.base_revision` (`required`
        or `invalid`). A `base_revision` that is not the current `revision` is `409
        stale_revision` with the current Listing under `current` and nothing written
        (a replay is also a 409: reload). A request that changes nothing is `200`
        and keeps the revision; otherwise the revision rises by one. Another account''s,
        an unknown or a malformed Listing is `404 not_found`; an account that may
        not edit, or a Listing that is not editable (sold, rented, removed or restricted),
        is `403 forbidden`. The body may be at most 64 KiB (`400` with `fields.order`
        `invalid`) and the `image_order` limit (120 per hour per account) applies:
        `429` with `Retry-After`. Files are never touched. Never cached.'
      summary: Reorder the images of an own Draft and/or choose its cover
