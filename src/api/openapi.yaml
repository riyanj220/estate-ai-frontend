                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    ActorSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        account_type:
          $ref: '#/components/schemas/ActorSummaryAccountTypeEnum'
        state:
          $ref: '#/components/schemas/StateEnum'
        email:
          type: string
          description: 'The account''s own email. Private: owner only.'
        full_name:
          type: string
          description: Individual profile name; empty when none.
        agency_name:
          type: string
          description: Agency name (public); empty for non-agency accounts.
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/CapabilitiesEnum'
      required:
      - account_type
      - agency_name
      - capabilities
      - email
      - full_name
      - id
      - state
    ActorSummaryAccountTypeEnum:
      enum:
      - individual
      - agency
      - admin
      type: string
      description: |-
        * `individual` - individual
        * `agency` - agency
        * `admin` - admin
    AdminMe:
      type: object
      properties:
        id:
          type: string
          format: uuid
        account_type:
          $ref: '#/components/schemas/AdminMeAccountTypeEnum'
        state:
          $ref: '#/components/schemas/StateEnum'
      required:
      - account_type
      - id
      - state
    AdminMeAccountTypeEnum:
      enum:
      - admin
      type: string
      description: '* `admin` - admin'
    AgencyProfile:
      type: object
      properties:
        agency_name:
          type: string
          description: Public.
        description:
          type: string
          description: Public. Empty when not set.
        city_id:
          type: string
          format: uuid
          description: Public. An active City reference id.
        business_phone:
          type: string
          description: 'The owner''s own business phone in E.164. Private: returned
            only here.'
        office_address:
          type: string
          description: 'The owner''s own office address. Private: returned only here.'
        email:
          type: string
          description: The current sign-in address. Private.
        pending_email:
          type: string
          nullable: true
          description: The address of the newest unused, unexpired email-change request,
            or null.
        verification_status:
          type: string
          description: Read-only Agency Verification status (`unverified` until a
            later story).
        image:
          allOf:
          - $ref: '#/components/schemas/ProfileImage'
          nullable: true
          description: The logo as the owner sees it, or null (none, or its file was
            lost).
        agency_id:
          type: string
          format: uuid
          description: The public Agency profile id (not the account id), used in
            `logo_url`. Returned only in the owner's own response.
        logo_url:
          type: string
          nullable: true
          description: The public logo route `/api/v1/agencies/{agency_id}/logo`,
            or null without a logo. It answers 404 unless the Agency account is Active.
      required:
      - agency_id
      - agency_name
      - business_phone
      - city_id
      - description
      - email
      - image
      - logo_url
      - office_address
      - pending_email
      - verification_status
    AgencyRegistrationRequest:
      type: object
      description: |-
        Strict allowlist of the six fields; the account type and verification status are never
        client-chosen. Rules come from `identity.validation`; every failing field is reported at
        once.
      properties:
        agency_name:
          type: string
          minLength: 1
          description: 2 to 100 letters, digits, spaces and & , . - ' ( ) /. Shown
            publicly.
        email:
          type: string
          minLength: 1
          description: The business email. At most 254 characters.
        phone:
          type: string
          minLength: 1
          description: 'Business phone (private): Pakistani mobile or international
            number.'
        office_address:
          type: string
          minLength: 1
          description: 5 to 300 characters. Private.
        city_id:
          type: string
          minLength: 1
          description: Id of an active city from the City reference list.
        password:
          type: string
          minLength: 1
          description: 8 to 1024 characters, not a common password, not the email
            address.
      required:
      - agency_name
      - city_id
      - email
      - office_address
      - password
      - phone
    Amenity:
      type: object
      description: |-
        Allowlist. Codes, labels and groups are plain strings (managed in the database, never
        OpenAPI enums). `kind` is the closed vocabulary the form groups by; `nearby` entries are
        declared by the seller and are never verified.
      properties:
        code:
          type: string
        label:
          type: string
        kind:
          $ref: '#/components/schemas/AmenityKindEnum'
        group:
          type: string
      required:
      - code
      - group
      - kind
      - label
    AmenityKindEnum:
      enum:
      - on_property
      - community
      - nearby
      type: string
      description: |-
        * `on_property` - on_property
        * `community` - community
        * `nearby` - nearby
    AmenityList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Amenity'
      required:
      - items
    Applicability:
      type: object
      properties:
        purposes:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
        subtypes:
