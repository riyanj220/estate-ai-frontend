                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/email-changes/confirm:
    post:
      operationId: confirm_email_change
      description: 'POST, not GET, so link prefetchers cannot consume the single-use
        token. Public: no session or CSRF token needed, so the link works in any browser.
        Errors: `link_invalid` (also when the address was taken meanwhile), `link_expired`
        (410), `link_used` (409). On success the sign-in address is replaced and verified;
        sessions stay open. Limited per client (429 with `Retry-After`).'
      summary: Confirm an email-change link
      tags:
      - email-changes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeConfirmRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChanged'
          description: Email changed
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
