  /api/v1/listings/{listing_id}/republish:
    post:
      operationId: republish_listing
      description: 'Needs `X-CSRFToken` and an `Idempotency-Key` header (same rules
        as publishing). Body: `{base_revision}` and nothing else. The Listing becomes
        `published` and public again if its owner is Active, after the same complete
        validation as publishing (every stored value is judged again, all problems
        at once). `publication_kind` says how it was recorded: `republish_free` (no
        publication used) only when the Listing''s last counted publication is from
        the same Karachi calendar month as now and none of the purpose, category,
        subtype, city, locality, area value or area unit has changed; otherwise `republish_counted`,
        which uses one monthly publication. The same key with the same body within
        24 hours returns the Listing as it is now with the original `publication_kind`
        and no second publication; the same key with another body is `422 idempotency_key_reused`.
        Refusals, in order: another account''s, an administrator''s, an unknown and
        a malformed id are `404 not_found`; a Visitor is `401`; a `base_revision`
        that is not the current `revision` is `409 stale_revision` with the Listing
        under `current`; a Listing that is not `archived` (a Sold or Rented one must
        be archived first; a Removed one never returns) is `409 conflict`; a restricted
        Listing is `403 forbidden`; an Email-unverified account is `403 email_not_verified`
        and a Suspended one `403 publishing_unavailable`; every missing or invalid
