  /api/v1/admin/accounts/{account_id}/suspend:
    post:
      operationId: suspend_admin_account
      description: '`reason` is 5 to 500 characters after trimming, one line, without
        contact details, else `400 validation_error`. An unknown id or an administrator
        account is `404 not_found`. A Suspended or Deactivated account is `409 conflict`.
        The account sees the reason; its Listings leave public view. Needs `X-CSRFToken`.
        Visitors get `401 unauthenticated`; signed-in non-administrators get `404
        not_found`. Never cached.'
