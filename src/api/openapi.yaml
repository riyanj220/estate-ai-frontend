      type: string
      description: |-
        * `total` - total
        * `per_unit` - per_unit
        * `rental_period` - rental_period
    Profile:
      type: object
      properties:
        full_name:
          type: string
        phone:
          type: string
          description: 'The owner''s own phone number in E.164. Private: returned
            only here.'
        email:
          type: string
          description: The current sign-in address.
        pending_email:
          type: string
          nullable: true
          description: The address of the newest unused, unexpired email-change request,
            or null.
      required:
      - email
      - full_name
      - pending_email
      - phone
    ProvenanceEntry:
      type: object
      properties:
        origin:
          $ref: '#/components/schemas/OriginEnum'
