      required:
      - client_turn_id
      - message
    AssistantTurnResult:
      type: object
      properties:
        outcome:
          $ref: '#/components/schemas/OutcomeEnum'
        message:
          type: string
          description: A notice to show; empty when there is nothing to say.
        turn:
          allOf:
          - $ref: '#/components/schemas/AssistantTurn'
          nullable: true
          description: 'Null unless `success`: nothing was stored.'
        next_step:
          allOf:
          - $ref: '#/components/schemas/AssistantNextStep'
          nullable: true
          description: Null unless `success`.
        summary:
          type: array
          items:
            $ref: '#/components/schemas/AssistantFact'
          description: Empty unless `success`.
      required:
      - message
      - next_step
      - outcome
      - summary
      - turn
    AvailabilityEnum:
      enum:
      - available
      - sold
      - rented
      - unavailable
      type: string
      description: |-
        * `available` - available
        * `sold` - sold
        * `rented` - rented
        * `unavailable` - unavailable
    BallotingStatusEnum:
      enum:
      - not_applicable
      - balloting_pending
      - balloted
      type: string
      description: |-
        * `not_applicable` - not_applicable
        * `balloting_pending` - balloting_pending
        * `balloted` - balloted
    BusinessUseEnum:
      enum:
      - retail
      - restaurant
      - office_work
      - clinic
      - warehouse
      - showroom
      - mixed
      - other
      type: string
      description: |-
        * `retail` - retail
        * `restaurant` - restaurant
        * `office_work` - office_work
        * `clinic` - clinic
        * `warehouse` - warehouse
        * `showroom` - showroom
        * `mixed` - mixed
        * `other` - other
    CapabilitiesEnum:
      enum:
      - sign_in
      - browse
      - view_drafts
      - edit_drafts
      - publish
      - send_messages
      - read_conversations
      - report
      - request_support
      - request_deactivation
      type: string
      description: |-
        * `sign_in` - sign_in
        * `browse` - browse
        * `view_drafts` - view_drafts
        * `edit_drafts` - edit_drafts
        * `publish` - publish
        * `send_messages` - send_messages
        * `read_conversations` - read_conversations
        * `report` - report
        * `request_support` - request_support
        * `request_deactivation` - request_deactivation
    CategoryEnum:
      enum:
      - house
      - apartment
      - plot
      - commercial
      type: string
      description: |-
        * `house` - house
        * `apartment` - apartment
        * `plot` - plot
        * `commercial` - commercial
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          minLength: 1
          description: The password in use now.
        new_password:
          type: string
          minLength: 1
          description: 8 to 1024 characters, not common, not the email address, not
