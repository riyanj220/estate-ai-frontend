      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    CityList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/City'
      required:
      - items
    CodeEnum:
      enum:
