          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: update_listing
      description: 'Needs `X-CSRFToken`. Body: `{base_revision, fields}` and nothing
        else (any other key, `origin` and `confirmed` included, is `validation_error`
        `unknown_field`). `fields` holds registry ids: `title`, `description`, `asking_price`
        (a decimal string in PKR, at most two decimals), `price_basis`, `rental_period`,
        `area_value` (a decimal string, at most four decimals, above zero; never a
        JSON number), `area_unit` and `marla_basis` (`"225"`, `"250"` or `"272.25"`
        square feet per marla, only while the unit is marla or kanal; changing the
        unit away clears it) and the House and Apartment details (`bedrooms`, `bathrooms`,
        `construction_year`, `condition`, `furnishing`, `parking_spaces`, `occupancy_status`,
        `covered_area_sqft` (a decimal string in square feet), the House set `total_floors`,
        `kitchens`, `construction_status`, room counts and `basement`, and the Apartment
        set `floor_number`, `building_floors`, `lift`, `backup_electricity`, `building_security`,
        `balcony_or_terrace`, `building_lobby`, `intercom` and `maintenance_charges`
        (PKR per month)), the details Shops and Offices share with them (`condition`,
        `furnishing`, `parking_spaces`, `occupancy_status`, floors, `lift`, `building_security`,
        `building_lobby`, `maintenance_charges`), the utilities `electricity`, `water`
        and `gas`, the Plot and Plot File details (`plot_width`, `plot_depth` and
        `road_width_ft` as decimal strings in feet with at most two decimals, `possession_status`,
        `corner_plot`, `balloting_status`, `sewerage`, `development_status`, `approval_authority`,
        `park_facing`, `main_boulevard`, `boundary_wall`, `orientation`, `plot_file_status`)
        and the Shop and Office details (`business_use`, `frontage_ft`, `road_access`,
        `ceiling_height_ft`, `power_load_kw`, `three_phase_electricity`, `conference_rooms`,
        `business_centre_facilities`) and the sale and rent terms (`price_negotiable`
        for both; sale only `possession_availability`; rent only `security_deposit`
        and `advance_rent` as decimal strings in PKR with at most two decimals, `availability_date`
        as text `YYYY-MM-DD` between 2000-01-01 and 2100-12-31, `minimum_lease_months`,
        `notice_period_days`, the four `utility_*_included` answers, `pets_allowed`
        and `occupant_restrictions`; the rent terms are `not_applicable` on a sale
        Draft and the other way round; a rental period is never assumed) and the location:
        `city` and `locality` as uuid text of an active city and one of its localities
        (`/api/v1/reference/cities` and `/api/v1/reference/cities/{city_id}/localities`;
        a locality of another city is `locality_not_in_city`, a locality without a
        city `invalid`; changing or clearing `city` clears the stored `locality` in
        the same write), the public location text `society`, `phase`, `sector` and
        `block` (up to 60 characters, no phone numbers or email addresses) and the
        PRIVATE address `street` (up to 120 characters), `house_number` (up to 30)
        and `latitude` and `longitude` (decimal strings with at most six decimals,
        -90 to 90 and -180 to 180, both or neither; `out_of_range` otherwise): the
        private fields are returned only to the owner and never appear in any public
        response. `amenities` is the map `{code: "present" | "none"}` of catalogue
        codes (`/api/v1/reference/amenities`): the sent map replaces the whole stored
        one, `null` or `{}` clears it, a code that is left out is unanswered (never
        `none`), an unknown or inactive code, another state, a non-object or more
        than 40 entries is `invalid`; nearby facilities are seller-declared (no distance,
        no verification). Installment, payment type, down payment and title or approval
        document terms are not supported yet (`unknown_field`). Possession, balloting,
        development, approval and plot file status are seller-declared (registry flag
        `seller_declared`): the owner''s claim, never verified by EstateAI. A Plot
        File allows only `file_only` for `possession_status` and the other Subtypes
        refuse it (`invalid_choice`). Ids the registry does not define (for example
        installment, down payment, title document or mortgage attributes) are `unknown_field`.
        Counts are JSON integers and yes/no answers are JSON `true`/`false`, never
        text; unanswered is `null`, never 0 or false. The registry says which apply
        to which Subtype (`not_applicable` otherwise); `null` clears a field. `area_sqft`
        is computed by the server and is `not_editable` as input. Saving never needs
        complete data. Every saved field is recorded as `manual` and confirmed; the
        client never chooses provenance. A `base_revision` that is not the current
        `revision` is `409 stale_revision` with the current Listing under `current`
        and nothing written (a retried PATCH after it succeeded is also a 409: reload).
        An edit that changes nothing is `200` and keeps the revision. `400` carries
        codes keyed by registry field id (`invalid`, `too_short`, `too_long`, `invalid_price`,
        `invalid_area`, `invalid_range`, `invalid_floor`, `invalid_date`, `invalid_choice`,
        `not_applicable`, `invalid_measure`, `out_of_range`, `locality_not_in_city`,
        `contains_contact_details`, `not_editable` (also an identity field of a `published`
        Listing: `city`, `locality`, `area_value` and `area_unit` are locked while
        it is published, editable as a Draft or Archived; `locality` and the area
        may be corrected once, see `/correction`; `marla_basis` stays editable); unknown
        ids are `unknown_field` under `non_field_errors`) and never echoes a value.
        Another account''s, an unknown or a malformed id is `404 not_found`; an account
        that may not edit (Suspended, Deactivated) is `403 forbidden`, and so is a
        `sold`, `rented` or `removed` Listing or a restricted one (view only). A `draft`,
        `published` and `archived` Listing may be edited. An edit of a `published`
        Listing must leave it complete (the same rules as publication): otherwise
        `400 validation_error` names every missing or invalid item at once (clearing
        the title or a price, a locality outside the city) and nothing is written;
        an edit of an `archived` one is judged like a Draft edit. These edits use
        no publication and write no event. Never cached.'
      summary: Edit one of the signed-in account's own Listings
      parameters:
      - in: path
        name: listing_id
        schema:
          type: string
        required: true
      tags:
      - listings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingUpdateRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: The updated Listing
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingConflict'
          description: 'Stale revision: the Listing changed; `current` holds it'
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: delete_listing
      description: 'Needs `X-CSRFToken`. Deletes the Draft and everything of it: its
        images (the stored files go and the bytes are given back to the account''s
        storage), its fields, private address and revision history. This cannot be
        undone. `204` has no body. Only a `draft` can be deleted here: any other status
        is `409 conflict` and nothing changes. Another account''s, an administrator''s,
        an unknown, a malformed and an already deleted id are all `404 not_found`;
        an account that may not edit (Suspended, Deactivated) is `403 forbidden`.
        Never cached.'
