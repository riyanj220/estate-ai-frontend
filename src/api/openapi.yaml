  /api/v1/session:
    post:
      operationId: sign_in
      description: Needs an `X-CSRFToken` header (fetch it from `GET /api/v1/csrf`).
        On success sets the HttpOnly `estate_session` cookie. Wrong password, unknown
        email, a Deactivated account and a throttled attempt all answer the same `401
        invalid_credentials`.
      summary: Sign in
      tags:
      - session
      requestBody:
        content:
          application/json:
