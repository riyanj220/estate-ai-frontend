      description: |-
        * `house` - house
        * `apartment` - apartment
        * `plot` - plot
        * `commercial` - commercial
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          minLength: 1
          description: The password in use now.
        new_password:
          type: string
          minLength: 1
          description: 8 to 1024 characters, not common, not the email address, not
