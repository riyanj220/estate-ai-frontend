    post:
      operationId: lookup_admin_account
      description: 'A reasoned private read: `reason` (10 to 300 characters, one line,
        no contact details) is recorded in the audit trail. Only Individual and Agency
        accounts; an unknown or administrator address is `404 not_found`. Needs `X-CSRFToken`.
