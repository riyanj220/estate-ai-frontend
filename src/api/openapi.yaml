        notices:
          type: array
          items:
            type: string
          description: Plain text.
      required:
      - applied
      - client_turn_id
      - conflicts
      - created_at
      - id
      - message
      - notices
      - rejected
      - reply
      - sequence
      - sources
    AssistantTurnBodyRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
        client_turn_id:
          type: string
          format: uuid
