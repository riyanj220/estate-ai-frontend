          type: boolean
      required:
      - confirmed
      - origin
    PurposeEnum:
      enum:
      - sale
      - rent
      type: string
      description: |-
        * `sale` - sale
        * `rent` - rent
    RegistrationAccepted:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/RegistrationAcceptedStatusEnum'
      required:
      - status
    RegistrationAcceptedStatusEnum:
      enum:
      - check_your_email
      type: string
      description: '* `check_your_email` - check_your_email'
    Registry:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        taxonomy:
          $ref: '#/components/schemas/Taxonomy'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/RegistryField'
      required:
      - fields
      - taxonomy
      - version
    RegistryField:
      type: object
      properties:
        id:
          type: string
          description: Stable snake_case id.
        type:
          $ref: '#/components/schemas/FieldTypeEnum'
        requirement:
          $ref: '#/components/schemas/FieldRequirementEnum'
        applicability:
          allOf:
          - $ref: '#/components/schemas/Applicability'
          description: Empty lists mean all values.
        allowed_values:
          type: array
          items:
            type: string
          nullable: true
          description: Enums only; null otherwise.
        allowed_values_by_purpose:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          nullable: true
          description: Enums narrowed by Listing purpose (purpose -> allowed values);
            else null.
        allowed_values_by_subtype:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          nullable: true
          description: Enums narrowed by Listing Subtype (Subtype -> allowed values,
            one entry per Subtype the field applies to); else null. When present it
            takes precedence over the choices in `allowed_values` for that Subtype.
        seller_declared:
          type: boolean
          description: 'A claim the seller makes (legal, approval, possession): show
            it as "Seller-declared", never as verified by EstateAI.'
        min_length:
          type: integer
          nullable: true
          description: 'Text only: minimum characters after normalisation.'
        max_length:
          type: integer
          nullable: true
          description: 'Text only: maximum characters after normalisation.'
        min:
          type: string
          nullable: true
          description: 'Money, decimal and integer: smallest value, a decimal string.'
        max:
          type: string
          nullable: true
          description: 'Money, decimal and integer: largest value, a decimal string.'
        currency:
          type: string
          nullable: true
          description: 'Money only: `PKR`.'
        scale:
          type: integer
          nullable: true
          description: 'Decimal only: the number of decimals stored and returned.'
        derived:
          type: boolean
          description: Computed by the server from other fields; read-only, never
            accepted as input.
        description:
          type: string
          nullable: true
          description: What the value means, for the form; null when not needed.
        class_:
          allOf:
          - $ref: '#/components/schemas/FieldClassEnum'
          title: 'Class '
        searchable:
          type: boolean
        sortable:
          type: boolean
        ai_extractable:
          type: boolean
        valuation_input:
          type: boolean
        quota_identity:
          type: boolean
      required:
      - ai_extractable
      - allowed_values
      - allowed_values_by_purpose
      - allowed_values_by_subtype
      - applicability
      - class_
      - currency
      - derived
      - description
      - id
      - max
      - max_length
      - min
      - min_length
      - quota_identity
      - requirement
      - scale
      - searchable
      - seller_declared
      - sortable
      - type
      - valuation_input
    RentalPeriodEnum:
      enum:
