      properties:
        unread:
          type: integer
          minimum: 0
      required:
      - unread
    VerdictEnum:
      enum:
      - about_equal
      - above
      - below
      type: string
      description: |-
        * `about_equal` - about_equal
        * `above` - above
        * `below` - below
    VerificationActionEnum:
      enum:
      - approved
      - rejected
      - revoked
      - withdrawn
      type: string
      description: |-
        * `approved` - approved
        * `rejected` - rejected
        * `revoked` - revoked
        * `withdrawn` - withdrawn
    VerificationDecision:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/VerificationRequestStatusEnum'
        decided_at:
          type: string
          format: date-time
      required:
      - decided_at
      - id
      - status
    VerificationDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/VerificationRequestStatusEnum'
        business_name:
          type: string
        agency_name:
          type: string
          nullable: true
        agency_id:
          type: string
          format: uuid
          nullable: true
          description: The public Agency id.
        account_state:
          type: string
          nullable: true
          description: '`email_unverified`, `active`, `suspended` or `deactivated`.'
        submitted_at:
          type: string
          format: date-time
        registration_number:
          type: string
          description: Private.
        note:
          type: string
          description: Private.
        decided_at:
          type: string
          format: date-time
          nullable: true
        decision_reason:
          type: string
        history:
          type: array
          items:
            $ref: '#/components/schemas/VerificationHistory'
      required:
      - account_state
      - agency_id
      - agency_name
      - business_name
      - decided_at
      - decision_reason
      - history
      - id
      - note
      - registration_number
      - status
      - submitted_at
    VerificationHistory:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/VerificationActionEnum'
        at:
          type: string
          format: date-time
        by_account_id:
          type: string
          format: uuid
          description: The administrator, or the Agency for `withdrawn`.
        reason:
          type: string
      required:
      - action
      - at
      - by_account_id
      - reason
    VerificationQueue:
      type: object
      properties:
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/_AgencySummary'
      required:
      - next
      - previous
      - results
    VerificationReasonRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 5
          description: One line, without contact details. The Agency reads it.
          maxLength: 500
      required:
      - reason
    VerificationRequestRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          description: The address to send a new link to.
      required:
      - email
    VerificationRequestStatusEnum:
      enum:
      - pending
      - verified
      - rejected
      - revoked
      - withdrawn
      type: string
      description: |-
        * `pending` - pending
        * `verified` - verified
        * `rejected` - rejected
        * `revoked` - revoked
        * `withdrawn` - withdrawn
    VerificationSubmitRequest:
      type: object
      properties:
        business_name:
          type: string
          minLength: 2
          maxLength: 100
        registration_number:
          type: string
          minLength: 3
          description: 'Registration or licence number: letters, digits, spaces, `.`,
            `/`, `-`.'
          maxLength: 60
        note:
          type: string
          maxLength: 500
      required:
      - business_name
      - registration_number
    Verified:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/EmailVerifiedStatusEnum'
      required:
      - status
    VisibilityEnum:
      enum:
      - private
      - public
      type: string
      description: |-
        * `private` - PRIVATE
        * `public` - PUBLIC
    VoiceUploadRequest:
      type: object
      description: 'Documentation of the multipart body: exactly one part, named `audio`.'
      properties:
        audio:
          type: string
          format: binary
          description: A WebM, Ogg, MP4 (M4A) or WAV recording of up to 2 MB (2,097,152
            bytes).
      required:
      - audio
    _AgencySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/VerificationRequestStatusEnum'
        business_name:
          type: string
        agency_name:
          type: string
          nullable: true
        agency_id:
          type: string
          format: uuid
          nullable: true
          description: The public Agency id.
        account_state:
          type: string
          nullable: true
          description: '`email_unverified`, `active`, `suspended` or `deactivated`.'
        submitted_at:
          type: string
          format: date-time
      required:
      - account_state
      - agency_id
      - agency_name
      - business_name
      - id
      - status
      - submitted_at
    _Row:
      type: object
      properties:
        id:
          type: string
          format: uuid
        listing_id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
          description: As it was when reported.
        reason:
          $ref: '#/components/schemas/ReportReasonEnum'
        status:
          $ref: '#/components/schemas/ReportStatusEnum'
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - id
      - listing_id
      - reason
      - status
      - title
    _Unresolved:
      type: object
      properties:
        pending:
          type: integer
        reviewing:
          type: integer
      required:
      - pending
      - reviewing
    ErrorCode:
      type: string
      enum:
      - bad_request
      - validation_error
      - link_invalid
      - unauthenticated
      - invalid_credentials
      - forbidden
      - email_not_verified
      - publishing_unavailable
      - messaging_email_unverified
      - messaging_unavailable
      - not_found
      - method_not_allowed
      - not_acceptable
      - stale_revision
      - conflict
      - quota_exhausted
      - correction_unavailable
      - storage_cap_exceeded
      - too_many_images
      - own_listing
      - conversation_read_only
      - counterpart_unavailable
      - link_used
      - link_expired
      - unsupported_media_type
      - idempotency_key_reused
      - throttled
      - server_error
      - busy
      description: Stable error code catalogue.
    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: estate_session
