      description: 'Needs `X-CSRFToken`. Body: `{base_revision, status}` and nothing
        else; `status` is `archived`, `sold` or `rented` (anything else is `400 validation_error`,
        `fields.status`). Allowed moves: `published` to `archived`, `sold` or `rented`;
        `sold` and `rented` to `archived`. Every other move (from a `draft`, an `archived`
        or the same status) is `409 conflict` and nothing is written; a Listing never
        returns to `published` here. `sold` is only for a Listing with purpose `sale`
        and `rented` only for purpose `rent` (`409 conflict` otherwise). No publication
        is used and no key is needed. `200` is the updated Listing; it is no longer
        public. A Suspended owner may only archive (`403 forbidden` for `sold` and
        `rented`); a restricted Listing may only be archived by its owner (`403 forbidden`
        otherwise) and a `removed` one cannot be changed (`403 forbidden`). A `base_revision`
        that is not the current `revision` is `409 stale_revision` with the Listing
        under `current`. Another account''s, an administrator''s, an unknown and a
        malformed id are `404 not_found`; a Visitor gets `401`. Never cached.'
