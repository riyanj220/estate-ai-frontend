                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: sign_out
      description: Ends only the current session and clears the cookie. Needs `X-CSRFToken`.
        Without a valid session the answer is `401 unauthenticated`.
      summary: Sign out
      tags:
      - session
      security:
      - sessionCookie: []
      responses:
        '204':
          description: Signed out
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    AccountLookupRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 300
        email:
          type: string
          minLength: 1
          description: Matched ignoring case.
          maxLength: 254
      required:
      - email
      - reason
    AccountReasonRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 5
          description: One line, without contact details.
          maxLength: 500
      required:
      - reason
    AccountRef:
      type: object
      properties:
        type:
          type: string
        masked_email:
          type: string
      required:
      - masked_email
      - type
    AccountStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
        account_type:
          $ref: '#/components/schemas/OwnerAccountTypeEnum'
        state:
          $ref: '#/components/schemas/StateEnum'
        suspension_reason:
          type: string
          description: Empty when none.
        suspended_at:
          type: string
          format: date-time
          nullable: true
      required:
      - account_type
      - id
      - state
      - suspended_at
      - suspension_reason
    ActorSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        account_type:
          $ref: '#/components/schemas/ActorSummaryAccountTypeEnum'
        state:
          $ref: '#/components/schemas/StateEnum'
        email:
          type: string
          description: 'The account''s own email. Private: owner only.'
        full_name:
          type: string
          description: Individual profile name; empty when none.
        agency_name:
          type: string
          description: Agency name (public); empty for non-agency accounts.
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/CapabilitiesEnum'
        suspension_reason:
          type: string
          nullable: true
          description: 'Why the account is Suspended; null otherwise. Private: owner
            only.'
      required:
      - account_type
      - agency_name
      - capabilities
      - email
      - full_name
      - id
      - state
      - suspension_reason
    ActorSummaryAccountTypeEnum:
      enum:
      - individual
      - agency
      - admin
      type: string
      description: |-
        * `individual` - individual
        * `agency` - agency
        * `admin` - admin
    AdminAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        account_type:
          $ref: '#/components/schemas/OwnerAccountTypeEnum'
        state:
          $ref: '#/components/schemas/StateEnum'
        suspension_reason:
          type: string
          description: Empty when none.
        suspended_at:
          type: string
          format: date-time
          nullable: true
        email:
          type: string
          description: Private.
        display_name:
          type: string
          description: Full name or agency name; empty when there is no profile.
        email_verified:
          type: boolean
      required:
      - account_type
      - display_name
      - email
      - email_verified
      - id
      - state
      - suspended_at
      - suspension_reason
    AdminListingDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_account_id:
          type: string
          format: uuid
        owner:
          allOf:
          - $ref: '#/components/schemas/AccountRef'
          nullable: true
        status:
          $ref: '#/components/schemas/ListingStatusEnum'
        restricted:
          type: boolean
        under_review:
          type: boolean
        purpose:
          type: string
        category:
          type: string
        subtype:
          type: string
        title:
          type: string
          nullable: true
          description: Always null for a Draft.
        created_at:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
        attributes:
          type: object
          additionalProperties: {}
          description: Public registry fields that have a value.
        city:
          type: string
          nullable: true
        locality:
          type: string
          nullable: true
        media:
          type: array
          items:
            $ref: '#/components/schemas/PublicImage'
          description: Empty for a Draft.
        image_count:
          type: integer
        moderation_reason:
          type: string
          nullable: true
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ModerationActionEnum'
          description: What can be done now.
        first_published_at:
          type: string
          format: date-time
          nullable: true
        open_reports:
          type: integer
        history:
          type: array
          items:
            $ref: '#/components/schemas/ModerationRecord'
      required:
      - actions
      - attributes
      - category
      - city
      - created_at
      - description
      - first_published_at
      - history
      - id
      - image_count
      - locality
      - media
      - moderation_reason
      - open_reports
      - owner
      - owner_account_id
      - purpose
      - restricted
      - status
      - subtype
      - title
      - under_review
    AdminListingPage:
      type: object
      properties:
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminListingRow'
      required:
      - next
      - previous
      - results
    AdminListingRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_account_id:
          type: string
          format: uuid
        owner:
          allOf:
          - $ref: '#/components/schemas/AccountRef'
          nullable: true
        status:
          $ref: '#/components/schemas/ListingStatusEnum'
        restricted:
          type: boolean
        under_review:
          type: boolean
        purpose:
          type: string
        category:
          type: string
        subtype:
          type: string
        title:
          type: string
          nullable: true
          description: Always null for a Draft.
        created_at:
          type: string
          format: date-time
      required:
      - category
      - created_at
      - id
      - owner
      - owner_account_id
      - purpose
      - restricted
      - status
      - subtype
      - title
      - under_review
    AdminMe:
      type: object
      properties:
        id:
          type: string
          format: uuid
        account_type:
          $ref: '#/components/schemas/AdminMeAccountTypeEnum'
        state:
          $ref: '#/components/schemas/StateEnum'
      required:
      - account_type
      - id
      - state
    AdminMeAccountTypeEnum:
      enum:
      - admin
      type: string
      description: '* `admin` - admin'
    Advertiser:
      type: object
      description: Who advertises the Listing (FR-39). Nothing else about the owner
        is public here.
      properties:
        type:
          $ref: '#/components/schemas/OwnerAccountTypeEnum'
        agency_id:
          type: string
          format: uuid
          nullable: true
          description: 'Agencies only: the public profile id (`/api/v1/public/agencies/{agency_id}`).'
        agency_name:
          type: string
          nullable: true
          description: Agencies only.
        logo_url:
          type: string
          nullable: true
          description: 'Agencies only: the public logo route; null without a logo.'
        verified:
          type: boolean
          description: An Agency with Verification granted. Always false for now.
      required:
      - agency_id
      - agency_name
      - logo_url
      - type
      - verified
    AgencyProfile:
      type: object
      properties:
        agency_name:
          type: string
          description: Public.
        description:
          type: string
          description: Public. Empty when not set.
        city_id:
          type: string
          format: uuid
          description: Public. An active City reference id.
        business_phone:
          type: string
          description: 'The owner''s own business phone in E.164. Private: returned
            only here.'
        office_address:
          type: string
          description: 'The owner''s own office address. Private: returned only here.'
        email:
          type: string
          description: The current sign-in address. Private.
        pending_email:
          type: string
          nullable: true
          description: The address of the newest unused, unexpired email-change request,
            or null.
        verification_status:
          type: string
          description: 'Read-only: `verified` after an administrator approval, else
            `unverified`.'
        image:
          allOf:
          - $ref: '#/components/schemas/ProfileImage'
          nullable: true
          description: The logo as the owner sees it, or null (none, or its file was
            lost).
        agency_id:
          type: string
          format: uuid
          description: The public Agency profile id (not the account id), used in
            `logo_url`. Returned only in the owner's own response.
        logo_url:
          type: string
          nullable: true
          description: The public logo route `/api/v1/agencies/{agency_id}/logo`,
            or null without a logo. It answers 404 unless the Agency account is Active.
      required:
      - agency_id
      - agency_name
      - business_phone
      - city_id
      - description
      - email
      - image
      - logo_url
      - office_address
      - pending_email
      - verification_status
    AgencyRegistrationRequest:
      type: object
      description: |-
        Strict allowlist of the six fields; the account type and verification status are never
        client-chosen. Rules come from `identity.validation`; every failing field is reported at
        once.
      properties:
        agency_name:
          type: string
          minLength: 1
          description: 2 to 100 letters, digits, spaces and & , . - ' ( ) /. Shown
            publicly.
        email:
          type: string
          minLength: 1
          description: The business email. At most 254 characters.
        phone:
          type: string
          minLength: 1
          description: 'Business phone (private): Pakistani mobile or international
            number.'
        office_address:
          type: string
          minLength: 1
          description: 5 to 300 characters. Private.
        city_id:
          type: string
          minLength: 1
          description: Id of an active city from the City reference list.
        password:
          type: string
          minLength: 1
          description: 8 to 1024 characters, not a common password, not the email
            address.
      required:
      - agency_name
      - city_id
      - email
      - office_address
      - password
      - phone
    Amenity:
      type: object
      description: |-
        Allowlist. Codes, labels and groups are plain strings (managed in the database, never
        OpenAPI enums). `kind` is the closed vocabulary the form groups by; `nearby` entries are
        declared by the seller and are never verified.
      properties:
        code:
          type: string
        label:
          type: string
        kind:
          $ref: '#/components/schemas/AmenityKindEnum'
        group:
          type: string
      required:
      - code
      - group
      - kind
      - label
    AmenityKindEnum:
      enum:
      - on_property
      - community
      - nearby
      type: string
      description: |-
        * `on_property` - on_property
        * `community` - community
        * `nearby` - nearby
    AmenityList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Amenity'
      required:
      - items
    Applicability:
      type: object
      properties:
        purposes:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
        subtypes:
          type: array
          items:
            type: string
      required:
      - categories
      - purposes
      - subtypes
    ApprovalAuthorityEnum:
