          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/listings/{listing_id}/images/{image_id}:
    delete:
      operationId: delete_listing_image
      description: 'Needs `X-CSRFToken`. Deletes the image and its stored file, gives
        its bytes back to the account''s storage, renumbers the other images 0..n-1
        (removing the cover makes the image with the lowest remaining position the
