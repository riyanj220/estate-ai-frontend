  /api/v1/listings:
    post:
      operationId: create_listing_draft
      description: 'Needs `X-CSRFToken`. Body: `purpose`, `category` and `subtype`;
        any other field (`owner_account_id`, `status`, `revision`) is `validation_error`
        (`unknown_field`). Failing fields are reported at once (`required`, `invalid`,
        `invalid_choice`, `subtype_not_in_category`). Only Active and Email-unverified
        Individual and Agency accounts may start one (`forbidden` otherwise, administrators
        included). The Draft belongs to the account. At 20 open Drafts the answer
        is `429 throttled` without `Retry-After` (a cap clears when a Draft is removed).
        Never cached.'
      summary: Start a Draft
      tags:
      - listings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftCreateRequest'
        required: true
      security:
      - sessionCookie: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: The new Draft
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
