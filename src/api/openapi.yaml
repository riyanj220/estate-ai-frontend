  /api/v1/listings/{listing_id}/correction:
    get:
      operationId: get_listing_correction
      description: Owner only. `available` is true only for a `published`, not restricted
        Listing of an account that may edit it, whose last counted publication is
        less than 24 hours old and not yet used for a correction; `expires_at` then
        says when the window closes (+05:00). In every other case `available` is false
        and `expires_at` null. Another account's, an administrator's, an unknown and
        a malformed id are `404 not_found`; a Visitor gets `401`. Reads only. Never
        cached.
      summary: Whether one of the signed-in account's own Listings may still be corrected
      parameters:
      - in: path
        name: listing_id
        schema:
          type: string
        required: true
      tags:
      - listings
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionWindow'
          description: The window
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: '`unauthenticated`'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: '`not_found`'
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: correct_listing
      description: 'Needs `X-CSRFToken`. Body: `{base_revision, fields}` and nothing
        else; `fields` holds only what changes among `locality`, `area_value`, `area_unit`
        and `marla_basis` (any other id, `city`, `category`, `subtype` and `purpose`
        included, is `400 validation_error` and nothing is written). It can be done
        ONCE per counted publication, within 24 hours of it (exactly 24 hours is closed);
        it uses no publication, and a later republication in the same Karachi month
        with the corrected details unchanged is free. Order of refusals: another account''s,
        an administrator''s, an unknown and a malformed id are `404 not_found`; a
        Visitor is `401`; a `base_revision` that is not the current `revision` is
        `409 stale_revision` with the Listing under `current`; a Listing that is not
        `published` is `409 conflict`; a restricted Listing, a Suspended or a Deactivated
        account is `403 forbidden`; a closed or used window is `409 correction_unavailable`.
        Then the values are judged as for any edit of a published Listing, all at
        once (`400`, codes keyed by field id, for example `locality_not_in_city`,
        `invalid_area`, `required`, `not_applicable`). A `marla_basis` that differs
        while neither `area_value` nor `area_unit` does is `not_editable` (change
        it with an ordinary edit). A request that changes nothing is `400` with `non_field_errors`
        (`no_change`). A refused request does not use up the correction. Never cached.'
      summary: Correct the locality and area of a recently published Listing, once
