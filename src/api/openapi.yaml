      parameters:
      - in: query
        name: amenities
        schema:
          type: string
        description: Filter (amenities).
      - in: query
        name: area_sqft_max
        schema:
          type: string
        description: Filter (range).
      - in: query
        name: area_sqft_min
        schema:
          type: string
        description: Filter (range).
      - in: query
        name: asking_price_max
        schema:
          type: string
        description: Filter (range).
      - in: query
        name: asking_price_min
        schema:
          type: string
        description: Filter (range).
      - in: query
        name: bathrooms_max
        schema:
          type: integer
        description: Filter (range).
      - in: query
