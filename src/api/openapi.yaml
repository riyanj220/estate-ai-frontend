          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/agencies/{agency_id}/logo:
    get:
      operationId: get_agency_logo
      description: '`agency_id` is the public Agency profile id (never the account
        id), as given in `logo_url`. Served to anyone, a Visitor included, ONLY while
        the Agency account is Active; a Suspended, Deactivated or Email-unverified
        Agency, an Agency without a logo, an unknown id and a malformed id all get
        the identical `404 not_found`. The `200` carries the stored `Content-Type`,
        `Content-Length`, `Cache-Control: public, max-age=60` (a suspended Agency''s
        logo may stay in a cache for up to a minute), `X-Content-Type-Options: nosniff`,
        `Content-Disposition: inline` and `Content-Security-Policy: default-src ''none'';
        sandbox`; no cookie is set and nothing varies by cookie. `HEAD` answers the
        same headers without a body. `Range` and `Accept` are ignored; there is no
        `ETag`.'
      summary: An Agency's public logo
      parameters:
      - in: path
        name: agency_id
        schema:
          type: string
        required: true
      tags:
      - agencies
      responses:
        '200':
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
          description: The stored image bytes
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/csrf:
    get:
      operationId: get_csrf_token
      description: Sets the (HttpOnly) CSRF cookie and returns the matching token,
        which the client sends back as `X-CSRFToken` on sign-in and sign-out. Never
        cached.
      summary: Fetch a CSRF token
      tags:
      - csrf
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: The token
        '400':
          description: Bad request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
