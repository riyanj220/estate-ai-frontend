          nullable: true
          description: Enums narrowed by Listing Subtype (Subtype -> allowed values,
            one entry per Subtype the field applies to); else null. When present it
            takes precedence over the choices in `allowed_values` for that Subtype.
        seller_declared:
          type: boolean
          description: 'A claim the seller makes (legal, approval, possession): show
            it as "Seller-declared", never as verified by EstateAI.'
        section:
          allOf:
          - $ref: '#/components/schemas/SectionEnum'
          description: |-
            Where a form groups the field: `terms` (price, sale and rent terms), `location` (city, locality, the public location text and the private address; group by `class`), `amenities` (the amenity map, from the catalogue at `/api/v1/reference/amenities`) or `details`. Read this, never guess from applicability.

            * `details` - details
            * `terms` - terms
            * `location` - location
            * `amenities` - amenities
        min_length:
          type: integer
          nullable: true
          description: 'Text only: minimum characters after normalisation.'
        max_length:
          type: integer
          nullable: true
          description: 'Text only: maximum characters after normalisation.'
        min:
          type: string
          nullable: true
          description: 'Money, decimal and integer: smallest value, a decimal string.
            Date: the earliest date, `YYYY-MM-DD`.'
        max:
          type: string
          nullable: true
          description: 'Money, decimal and integer: largest value, a decimal string.
            Date: the latest date, `YYYY-MM-DD`.'
        currency:
          type: string
          nullable: true
          description: 'Money only: `PKR`.'
        scale:
          type: integer
          nullable: true
          description: 'Decimal only: the number of decimals stored and returned.'
        reference:
          type: string
          nullable: true
          description: 'Reference fields only: what the stored uuid points at, `city`
            or `locality`. The lists are `/api/v1/reference/cities` and `/api/v1/reference/cities/{city_id}/localities`;
            the value is the uuid, never a name.'
        derived:
          type: boolean
          description: Computed by the server from other fields; read-only, never
            accepted as input.
        description:
          type: string
          nullable: true
          description: What the value means, for the form; null when not needed.
        class_:
          allOf:
          - $ref: '#/components/schemas/FieldClassEnum'
          title: 'Class '
        searchable:
          type: boolean
        sortable:
          type: boolean
        ai_extractable:
          type: boolean
        valuation_input:
          type: boolean
        quota_identity:
          type: boolean
