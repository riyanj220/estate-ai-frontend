              schema:
                type: integer
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/me/email-change:
    post:
      operationId: request_email_change
      description: 'Needs `X-CSRFToken`; not available to administrators. A wrong
        current password is `validation_error` with `fields.current_password = incorrect`
        (shared with the password change: after repeated failures the same answer
