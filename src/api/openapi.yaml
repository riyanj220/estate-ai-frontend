      - kda
      - rda
      - fda
      - mda
      - gda
      - bda
      - peshawar_development_authority
      - private_society
      - none
      - other
      type: string
      description: |-
        * `lda` - lda
        * `cda` - cda
        * `kda` - kda
        * `rda` - rda
        * `fda` - fda
        * `mda` - mda
