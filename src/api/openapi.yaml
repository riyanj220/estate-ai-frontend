          type: integer
        schema_version:
          type: integer
        created_at:
          type: string
          format: date-time
        knowledge_notice:
          type: string
          description: Show it beside any source.
        turns:
          type: array
          items:
            $ref: '#/components/schemas/AssistantTurn'
          description: Oldest first.
        next_step:
          allOf:
          - $ref: '#/components/schemas/AssistantNextStep'
          nullable: true
          description: Null when the Listing is no longer a Draft.
        summary:
          type: array
          items:
            $ref: '#/components/schemas/AssistantFact'
          description: What the Listing holds now.
      required:
      - created_at
      - id
      - knowledge_notice
      - listing_id
      - next_step
      - registry_version
      - schema_version
      - summary
      - turns
    AssistantSessionOpenRequest:
      type: object
      properties:
        listing_id:
          type: string
          format: uuid
          description: The caller's own Draft.
